<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 460" font-family="Nunito, Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#374151"/></marker>
    <marker id="setaV" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#15803d"/></marker>
    <marker id="setaL" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b45309"/></marker>
  </defs>
  <rect width="990" height="460" fill="#ffffff"/>
  <text x="495" y="34" text-anchor="middle" font-size="20" font-weight="800" fill="#111827">Molécula de ATP e o ciclo ATP–ADP</text>

  <!-- molécula de ATP -->
  <g transform="translate(40,70)">
    <text x="0" y="0" font-size="13" font-weight="700" fill="#6b7280">ATP (adenosina trifosfato)</text>
    <!-- adenina -->
    <g transform="translate(0,20)">
      <polygon points="38,0 76,22 76,66 38,88 0,66 0,22" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/>
      <polygon points="76,22 110,0 134,26 118,56 76,56" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/>
      <text x="38" y="50" text-anchor="middle" font-size="13" font-weight="800" fill="#1e3a8a">adenina</text>
      <text x="38" y="104" text-anchor="middle" font-size="10" fill="#1e3a8a">base nitrogenada</text>
    </g>
    <!-- ribose -->
    <g transform="translate(120,78)">
      <polygon points="30,0 60,22 48,58 12,58 0,22" fill="#fce7f3" stroke="#be185d" stroke-width="2.5"/>
      <text x="30" y="34" text-anchor="middle" font-size="12" font-weight="800" fill="#9d174d">ribose</text>
      <text x="30" y="48" text-anchor="middle" font-size="10" fill="#9d174d">(açúcar)</text>
    </g>
    <line x1="118" y1="76" x2="134" y2="100" stroke="#374151" stroke-width="2"/>
    <!-- fosfatos -->
    <g transform="translate(190,86)">
      <line x1="0" y1="20" x2="24" y2="20" stroke="#374151" stroke-width="2"/>
      <circle cx="44" cy="20" r="20" fill="#fef3c7" stroke="#b45309" stroke-width="2.5"/><text x="44" y="25" text-anchor="middle" font-size="13" font-weight="800" fill="#78350f">P</text>
      <path d="M64 20 Q74 6 84 20" fill="none" stroke="#dc2626" stroke-width="3"/>
      <circle cx="104" cy="20" r="20" fill="#fef3c7" stroke="#b45309" stroke-width="2.5"/><text x="104" y="25" text-anchor="middle" font-size="13" font-weight="800" fill="#78350f">P</text>
      <path d="M124 20 Q134 6 144 20" fill="none" stroke="#dc2626" stroke-width="3"/>
      <circle cx="164" cy="20" r="20" fill="#fef3c7" stroke="#b45309" stroke-width="2.5"/><text x="164" y="25" text-anchor="middle" font-size="13" font-weight="800" fill="#78350f">P</text>
      <text x="104" y="62" text-anchor="middle" font-size="12" font-weight="700" fill="#78350f">três grupos fosfato</text>
      <text x="104" y="78" text-anchor="middle" font-size="10.5" fill="#b91c1c">ligações ricas em energia (~)</text>
    </g>
    <!-- adenosina -->
    <path d="M0 150 L180 150" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="90" y="166" text-anchor="middle" font-size="11" fill="#6b7280">adenina + ribose = adenosina</text>
  </g>

  <!-- ciclo ATP–ADP -->
  <g transform="translate(560,120)">
    <text x="130" y="-28" text-anchor="middle" font-size="13" font-weight="700" fill="#6b7280">Ciclo ATP–ADP</text>
    <!-- ATP -->
    <rect x="80" y="0" width="100" height="44" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="2.5"/>
    <text x="130" y="28" text-anchor="middle" font-size="18" font-weight="900" fill="#78350f">ATP</text>
    <!-- ADP + Pi -->
    <rect x="55" y="220" width="150" height="44" rx="12" fill="#e5e7eb" stroke="#4b5563" stroke-width="2.5"/>
    <text x="130" y="248" text-anchor="middle" font-size="18" font-weight="900" fill="#1f2937">ADP + Pi</text>
    <!-- seta direita: hidrólise, libera energia -->
    <path d="M190 30 C 250 60, 250 200, 215 238" fill="none" stroke="#b45309" stroke-width="4" marker-end="url(#setaL)"/>
    <text x="330" y="118" text-anchor="middle" font-size="12.5" font-weight="800" fill="#b45309">hidrólise</text>
    <text x="330" y="134" text-anchor="middle" font-size="11.5" fill="#b45309">libera energia →</text>
    <text x="330" y="150" text-anchor="middle" font-size="11" fill="#374151">contração muscular,</text>
    <text x="330" y="164" text-anchor="middle" font-size="11" fill="#374151">transporte ativo, síntese</text>
    <!-- seta esquerda: fosforilação, consome energia -->
    <path d="M70 238 C 10 200, 10 60, 48 30" fill="none" stroke="#15803d" stroke-width="4" marker-end="url(#setaV)"/>
    <text x="-62" y="118" text-anchor="middle" font-size="12.5" font-weight="800" fill="#15803d">fosforilação</text>
    <text x="-62" y="134" text-anchor="middle" font-size="11.5" fill="#15803d">← consome energia</text>
    <text x="-62" y="150" text-anchor="middle" font-size="11" fill="#374151">respiração celular,</text>
    <text x="-62" y="164" text-anchor="middle" font-size="11" fill="#374151">fotossíntese</text>
    <!-- centro -->
    <text x="130" y="128" text-anchor="middle" font-size="11" fill="#6b7280">A célula recicla</text>
    <text x="130" y="142" text-anchor="middle" font-size="11" fill="#6b7280">o próprio peso em ATP por dia</text>
  </g>

  <text x="495" y="440" text-anchor="middle" font-size="11" fill="#9ca3af">Evonauta · figura esquemática (não está em escala)</text>
</svg>
